# Render Deployment Blueprint — MaaCash (Neon)
# https://render.com/docs/blueprint-spec
#
# Scope: describes the canonical MaaCash service `maacash`
# (srv-dbnaciff3r2c7382tjgg). Its public origin is
# https://maacash.bloomcoretech.com.
#
# The former `bloomcore-one` Render service (srv-dbjalrk9v7es739ifkp0) was a
# duplicate runtime of the same repository and database. It was deleted after
# its hostname and Paystack responsibilities were verified to be unused. Do not
# recreate it.
#
# `maacash.onrender.com` remains reachable only while devices synchronize
# offline records that were created on that browser origin. It is a transition
# address, not a second product identity.
#
# The `bloomcore-one` string still appears in JWT audiences and the OIDC product
# slug. Those are internal authentication contracts and must not be renamed
# without a deliberate migration.
#
# Database schema is NEVER created or altered by a build. Provisioning the
# schema is a separate, explicitly run operator step — see
# docs/NEON-RENDER-DEPLOYMENT.md.

services:
  - type: web
    name: maacash
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev is required: NODE_ENV=production is set on the service, which
    # makes `npm ci` skip devDependencies. `next build` type-checks tests/, which
    # import vitest, so the build fails without them.
    buildCommand: npm ci --include=dev && npx prisma generate --schema=prisma/schema-pg.prisma && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # The live service has autoDeploy enabled: one authorised push to main is
    # the single coordinated deployment. No second push or manual deploy.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: PILOT
      # Canonical public origin. The custom domain is the public identity.
      - key: SITE_URL
        value: "https://maacash.bloomcoretech.com"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://maacash.bloomcoretech.com"
      # Secrets are set in the Render dashboard (sync: false = never stored in Git).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Transactional email. The sender must be on the verified Resend domain;
      # the public Gmail privacy contact is never a sender identity.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Security hardening (add values in the Render dashboard, never in Git).
      - key: RATE_LIMIT_HMAC_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: MFA_ENFORCEMENT
        value: "enforce"
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_ENABLED
        value: "true"
      - key: TURNSTILE_ALLOWED_HOSTNAMES
        value: "maacash.bloomcoretech.com"
      - key: TRUSTED_PROXY_HEADERS
        value: "true"
      # Edge HMAC proof over CF-Connecting-IP. Value is set only in the Render
      # dashboard. While absent, getClientIp() fails closed to the unknown
      # bucket; account-keyed throttles and Turnstile remain active.
      - key: EDGE_PROXY_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: "https://maacash.bloomcoretech.com"
      # Origin used by scripts/run-risk-retention-cron.mjs. SITE_URL is an
      # accepted fallback, but the scheduler contract uses this exact name.
      - key: MAACASH_APP_URL
        value: "https://maacash.bloomcoretech.com"
      # Staff use shared field devices: a 15-minute idle lock is the production
      # ceiling, with an 8-hour absolute session and a 5-minute background lock.
      - key: SESSION_IDLE_TIMEOUT_SECONDS
        value: "900"
      - key: SESSION_BACKGROUND_TIMEOUT_SECONDS
        value: "300"
      - key: SESSION_ABSOLUTE_TIMEOUT_SECONDS
        value: "28800"
      - key: OFFLINE_COLLECTIONS_ENABLED
        value: "false"
      - key: OFFLINE_MOMO_ENABLED
        value: "false"
      # Owner-confirmed public privacy contact. Not a sender identity.
      - key: BLOOMCORE_PRIVACY_EMAIL
        value: "bloomcoretechnologies@gmail.com"
      # Owner-confirmed signatory. The registered office is deliberately not
      # invented: set BLOOMCORE_REGISTERED_ADDRESS in the dashboard before any
      # controlled agreement can execute.
      - key: BLOOMCORE_AUTHORISED_SIGNATORY_NAME
        value: "Saviour Amegayie"
      - key: BLOOMCORE_AUTHORISED_SIGNATORY_CAPACITY
        value: "Proprietor"
      - key: BLOOMCORE_REGISTERED_ADDRESS
        sync: false
      # Shared-agent pseudonymisation key and the daily retention bearer token.
      # Values live only in the dashboard and in the scheduler secret store.
      - key: RISK_INTELLIGENCE_SALT
        sync: false
      - key: RISK_RETENTION_TOKEN
        sync: false
      - key: RISK_HOSTING_PROVIDERS
        sync: false
      - key: RISK_HOSTING_REGIONS
        sync: false
