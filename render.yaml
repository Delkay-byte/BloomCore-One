# Render Deployment Blueprint — BloomCore One (Neon)
# https://render.com/docs/blueprint-spec
#
# Scope: describes ONLY the Neon-backed service `bloomcore-one` (already created
# manually in the Render dashboard, service id srv-dbihvrmgekts73fdcbj0; the
# service was created as BIK-Prestige-Enterprise and renamed in place). Do not
# run "New → Blueprint" against this branch unless the existing service is
# first deleted, or a duplicate will be created.
#
# Database schema is NEVER created or altered by a build. Provisioning the
# schema is a separate, explicitly run operator step — see
# docs/NEON-RENDER-DEPLOYMENT.md.

services:
  - type: web
    name: bloomcore-one
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev is required: NODE_ENV=production is set on the service, which
    # makes `npm ci` skip devDependencies. `next build` type-checks tests/, which
    # import vitest, so the build fails without them.
    buildCommand: npm ci --include=dev && npx prisma generate --schema=prisma/schema-pg.prisma && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: PILOT
      # Secrets are set in the Render dashboard (sync: false = never stored in Git).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: SESSION_IDLE_TIMEOUT_SECONDS
        value: "28800"
      - key: SESSION_BACKGROUND_TIMEOUT_SECONDS
        value: "7200"
      - key: SESSION_ABSOLUTE_TIMEOUT_SECONDS
        value: "28800"
      - key: OFFLINE_COLLECTIONS_ENABLED
        value: "false"
      - key: OFFLINE_MOMO_ENABLED
        value: "false"
