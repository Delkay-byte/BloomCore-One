# Render Deployment Blueprint — MaaCash (Neon)
# https://render.com/docs/blueprint-spec
#
# Scope: describes the Neon-backed recovery service `bloomcore-one`
# (srv-dbjalrk9v7es739ifkp0). The primary MaaCash service is `maacash`
# (srv-dbnaciff3r2c7382tjgg); its canonical public origin is
# https://maacash.bloomcoretech.com. The `bloomcore-one` identifier and its
# onrender.com hostname are intentionally preserved: they are infrastructure
# contracts used by Paystack webhooks, Turnstile host checks and OIDC redirect
# URIs. Keep both Render hostnames reachable during the domain transition,
# because offline records are origin-scoped.
# Do not run "New → Blueprint" against this branch unless both services are
# first deleted, or a duplicate will be created.
#
# Database schema is NEVER created or altered by a build. Provisioning the
# schema is a separate, explicitly run operator step — see
# docs/NEON-RENDER-DEPLOYMENT.md.

services:
  - type: web
    name: bloomcore-one
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev is required: NODE_ENV=production is set on the service, which
    # makes `npm ci` skip devDependencies. `next build` type-checks tests/, which
    # import vitest, so the build fails without them.
    buildCommand: npm ci --include=dev && npx prisma generate --schema=prisma/schema-pg.prisma && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: PILOT
      # Canonical public origin. The custom domain is the public identity; the
      # onrender.com hosts remain operational transition addresses.
      - key: SITE_URL
        value: "https://maacash.bloomcoretech.com"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://maacash.bloomcoretech.com"
      # Secrets are set in the Render dashboard (sync: false = never stored in Git).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Security hardening (add values in the Render dashboard, never in Git).
      - key: RATE_LIMIT_HMAC_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: MFA_ENFORCEMENT
        value: "enforce"
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_ENABLED
        value: "false"
      - key: TURNSTILE_ALLOWED_HOSTNAMES
        value: "maacash.bloomcoretech.com,maacash.onrender.com,bloomcore-one.onrender.com"
      - key: TRUSTED_PROXY_HEADERS
        value: "true"
      - key: NEXTAUTH_URL
        value: "https://maacash.bloomcoretech.com"
      - key: SESSION_IDLE_TIMEOUT_SECONDS
        value: "28800"
      - key: SESSION_BACKGROUND_TIMEOUT_SECONDS
        value: "7200"
      - key: SESSION_ABSOLUTE_TIMEOUT_SECONDS
        value: "28800"
      - key: OFFLINE_COLLECTIONS_ENABLED
        value: "false"
      - key: OFFLINE_MOMO_ENABLED
        value: "false"
