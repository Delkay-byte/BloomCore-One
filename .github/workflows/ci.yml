name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare test database (SQLite)
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: file:../tests/test.db

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          DATABASE_URL: file:../tests/test.db

      - name: Production build
        run: npm run build
        env:
          # The build itself never uses real secrets; middleware requires the
          # variable to exist. Real secrets live only in Render's environment.
          JWT_SECRET: ci-test-secret-not-for-production
          DATABASE_URL: file:../tests/test.db
