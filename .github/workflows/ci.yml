name: CI

on:
  push:
    branches: [main, "security/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly supply-chain review; no deployment or production access.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  sqlite-verify:
    name: SQLite generate, lint, typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SQLite Prisma client
        run: npx prisma generate

      - name: Prepare disposable SQLite test database
        run: npx prisma db push --schema=prisma/schema.prisma
        env:
          DATABASE_URL: file:../tests/test.db?connection_limit=1&socket_timeout=30

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Security dependency audit (critical only)
        run: npm audit --audit-level=critical

      - name: SQLite functional and security tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          DATABASE_URL: file:../tests/test.db
          TURNSTILE_ENABLED: "false"
          RATE_LIMIT_HMAC_SECRET: ci-rate-limit-key-not-for-production-32b
          MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Production build
        run: npm run build
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          DATABASE_URL: file:../tests/test.db

  postgres-verify:
    name: PostgreSQL migration rehearsal and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maacash
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: maacash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maacash -d maacash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PG_TEST_USER: maacash
      PG_TEST_PASSWORD: disposable-ci-password
      PG_TEST_HOST: 127.0.0.1
      PG_TEST_PORT: "5432"
      PG_TEST_DB: maacash_test
      PG_TEST_CONFIRM: DISPOSABLE_TEST_DATABASE
      JWT_SECRET: ci-test-secret-not-for-production
      TURNSTILE_ENABLED: "false"
      RATE_LIMIT_HMAC_SECRET: ci-rate-limit-key-not-for-production-32b
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build disposable PostgreSQL connection variables
        shell: bash
        run: |
          url="postgresql://${PG_TEST_USER}:${PG_TEST_PASSWORD}@${PG_TEST_HOST}:${PG_TEST_PORT}/${PG_TEST_DB}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DIRECT_URL=${url}" >> "$GITHUB_ENV"
          echo "PG_DATABASE_URL=${url}" >> "$GITHUB_ENV"

      - name: Generate PostgreSQL Prisma client
        run: npx prisma generate --schema=prisma/schema-pg.prisma

      - name: Migration rehearsal on an empty disposable database
        run: npx prisma migrate deploy --config prisma.pg.config.ts

      - name: Confirm migration status
        run: npx prisma migrate status --config prisma.pg.config.ts

      - name: Schema drift check
        run: >-
          npx prisma migrate diff
          --config prisma.pg.config.ts
          --from-config-datasource
          --to-schema prisma/schema-pg.prisma
          --exit-code

      - name: PostgreSQL integration tests
        run: npx vitest run --config vitest.pg.config.ts

  mobile-browser:
    name: Mobile browser and offline-shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Mobile browser tests
        run: npm run test:e2e -- --project=mobile-chromium
        env:
          CI: "true"
          JWT_SECRET: e2e-secret-not-for-production
          TURNSTILE_ENABLED: "false"
          RATE_LIMIT_HMAC_SECRET: e2e-rate-limit-secret-32-bytes-long
          MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  secret-scan:
    name: Secret scan (working tree and full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify secret-file ignores
        shell: bash
        run: |
          set -euo pipefail
          for f in .env.production .env.staging .env.test .secrets/test.key; do
            mkdir -p "$(dirname "$f")"
            : > "$f"
            git check-ignore -q "$f" || { echo "Secret file is not ignored: $f"; exit 1; }
            rm -f "$f"
          done
          git check-ignore -q .env.example && { echo ".env.example must stay trackable"; exit 1; } || true

      - name: Gitleaks (full reachable history, redacted)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --log-opts="--all" --redact --no-banner \
            --exit-code 1 --verbose

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@018511a1aac61b6e92783189d8c0081eb8f69932 # v3.28.13
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@018511a1aac61b6e92783189d8c0081eb8f69932 # v3.28.13

      - name: Analyze (SARIF artifact; code scanning is not enabled on this repository)
        uses: github/codeql-action/analyze@018511a1aac61b6e92783189d8c0081eb8f69932 # v3.28.13
        with:
          output: codeql-results.sarif
          upload: never

      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-results
          path: codeql-results.sarif
          if-no-files-found: error

  dependency-review:
    name: Dependency review and lockfile-aware audit
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Dependency review (pull request only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
        with:
          fail-on-severity: high
          comment-summary-in-pr: false

      - name: Lockfile-aware production vulnerability audit
        run: npm audit --omit=dev --audit-level=high
